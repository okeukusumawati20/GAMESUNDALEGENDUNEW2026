<!DOCTYPE html>
<html lang="su"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunda Legends – Basa Sunda Kelas 12</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#f5c542;--gold2:#a8761a;--blue:#0b1f4d;--blue2:#1b4fb8;--cy:#5ad1ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;color:#eaf4ff;background:radial-gradient(ellipse at top,#1b3a85 0,#081433 55%,#030818 100%) fixed}
#app{max-width:520px;margin:auto;padding:14px}
h1{margin:6px 0;text-align:center;font-size:28px;letter-spacing:1px;color:var(--gold);text-shadow:0 0 12px #f5c54299,0 2px 0 #5a3b00}
.sub{text-align:center;color:var(--cy);font-size:13px;margin-bottom:12px}
.panel{background:linear-gradient(#112a63cc,#0a1a43cc);border:2px solid var(--gold2);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 0 14px #1b4fb866 inset,0 0 10px #000a}
input{width:100%;padding:12px;border-radius:8px;border:2px solid var(--gold2);background:#07122e;color:#fff;font-size:16px}
.btn{display:block;width:100%;padding:13px;margin:8px 0;border:2px solid #ffe28a;border-radius:10px;font-weight:800;font-size:16px;color:#3a2400;background:linear-gradient(#ffe28a,#f5c542 55%,#c08a1e);box-shadow:0 0 12px #f5c54299;cursor:pointer;text-transform:uppercase}
.btn:active{transform:scale(.97)}.btn.b{color:#fff;background:linear-gradient(#4f8cff,#1b4fb8);border-color:var(--cy);box-shadow:0 0 12px #5ad1ff77}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero{padding:10px;text-align:center;border:2px solid #345;border-radius:10px;background:#0a1a43;cursor:pointer}
.hero.sel{border-color:var(--gold);box-shadow:0 0 14px var(--gold)}
.hero .ic{font-size:44px;line-height:1.2}.hero b{display:block;color:var(--gold)}.hero small{color:#9bc}
.bar{height:12px;border-radius:6px;background:#000a;overflow:hidden;border:1px solid #567}.bar i{display:block;height:100%;transition:width .4s}
.hp i{background:linear-gradient(#7dff7d,#1a9a2a)}.xp i{background:linear-gradient(#7fd8ff,#1b6fe0)}.tm i{background:linear-gradient(#ffd36a,#e0501b)}
.top{display:flex;gap:8px;align-items:center}.top .ic{font-size:34px}.top>div{flex:1}
.stats{display:flex;justify-content:space-between;font-size:13px;margin:4px 0;color:var(--gold)}
.q{font-size:18px;font-weight:700;margin:10px 0}.tag{font-size:12px;color:var(--cy)}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:7px 0;padding:11px;border-radius:10px;border:2px solid #3b5ea8;background:linear-gradient(#17399a,#0d2262);color:#fff;font-size:15px;cursor:pointer}
.opt b{background:var(--gold);color:#3a2400;border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center}
.opt.ok{border-color:#4f4;background:#0a5a22}.opt.no{border-color:#f55;background:#6a1414}
.slot{display:flex;gap:8px;align-items:center;margin:7px 0}.slot span{flex:1;font-size:14px;font-weight:700;color:var(--gold)}
.drop{flex:1.3;min-height:44px;border:2px dashed var(--cy);border-radius:8px;display:grid;place-items:center;padding:4px;font-size:13px;text-align:center;background:#06143a}
.drop.f{border-style:solid;background:#17399a}.drop.ok{border-color:#4f4}.drop.no{border-color:#f55}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:40px}
.chip{padding:8px 10px;border-radius:8px;background:linear-gradient(#ffe28a,#d9a02a);color:#3a2400;font-size:13px;font-weight:700;cursor:grab}
.chip.sel{outline:3px solid var(--cy)}
#ban{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:40px;font-weight:900;color:var(--gold);text-shadow:0 0 18px #f80,0 3px 0 #600;pointer-events:none;opacity:0;z-index:9}
#ban.go{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.hit{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px);background:#600}75%{transform:translateX(8px)}}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px;border-bottom:1px solid #345}td:last-child{text-align:right;color:var(--gold)}
.me td{color:var(--cy);font-weight:700}.big{font-size:52px;text-align:center}.note{font-size:12px;color:#9bc;text-align:center}
.arena{position:relative;height:230px;margin:6px 0 8px;border-radius:14px;border:2px solid var(--gold2);overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#c9f58f44,transparent 60%),repeating-linear-gradient(60deg,#ffffff08 0 12px,transparent 12px 24px),linear-gradient(160deg,var(--t),#08140d 75%);box-shadow:0 0 14px #000a inset}
.ring{position:absolute;left:50%;top:52%;width:210px;height:120px;margin:-60px 0 0 -105px;border:3px solid #f5c54288;border-radius:50%;box-shadow:0 0 20px #f5c54255 inset}
.mm{position:absolute;left:6px;top:6px;width:58px;height:58px;border:2px solid var(--gold2);border-radius:10px;background:#0b2a3acc;padding:3px}
.sb{position:absolute;left:50%;top:5px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:3px 10px;border-radius:8px;background:#000a;font-size:13px;border:1px solid #567;white-space:nowrap}
.bl{color:#5ab4ff}.rd{color:#ff6a6a}
.gd{position:absolute;right:6px;top:6px;padding:3px 8px;border-radius:8px;background:#000a;color:var(--gold);font-weight:800;font-size:13px;border:1px solid var(--gold2)}
.un{position:absolute;width:120px;text-align:center}#en{right:8%;top:66px}.hu{left:8%;top:100px}
.un .nm{font-size:12px;font-weight:700;text-shadow:0 1px 2px #000;white-space:nowrap}.nm em{font-style:normal;background:#f5c542;color:#3a2400;border-radius:50%;padding:0 5px;margin-right:3px}
.un .bar{height:8px;margin:2px 10px}
.spr{font-size:56px;line-height:1.1;filter:drop-shadow(0 6px 4px #000a);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.xb{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:0;border:0}
#fl{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;top:50%;font-size:26px;font-weight:900;font-style:italic;text-shadow:0 2px 0 #000;animation:up 1.1s ease-out forwards}
.fl.g{color:#ffd54a}.fl.d{color:#ff5a5a}.fl.h{color:#7dff7d}
@keyframes up{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.atk{animation:atkh .5s}@keyframes atkh{40%{transform:translateX(90px) scale(1.15)}}
.atk2{animation:atke .5s}@keyframes atke{40%{transform:translateX(-90px) scale(1.15)}}
.hurt{animation:hurt .4s}@keyframes hurt{25%{filter:brightness(2.5) saturate(0)}50%{transform:translateX(6px)}}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.joy{width:84px;height:84px;border-radius:50%;border:2px solid #5ad1ff88;background:radial-gradient(#5ad1ff33,#0b1f4d88);display:grid;place-items:center}.joy i{width:36px;height:36px;border-radius:50%;background:radial-gradient(#9fe3ff,#2a7fd0);box-shadow:0 0 10px var(--cy)}
.sks{display:flex;gap:10px}.sk{text-align:center;font-size:11px;color:#cde}
.sk button{position:relative;width:56px;height:56px;border-radius:50%;font-size:26px;border:3px solid var(--gold);background:radial-gradient(#2a6bd6,#0b1f4d);box-shadow:0 0 10px #5ad1ff77;cursor:pointer}.sk button:disabled{filter:grayscale(1);opacity:.5}
.sk button b{position:absolute;right:-4px;top:-4px;background:var(--gold);color:#3a2400;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.rib{display:inline-flex;align-items:center;gap:10px;padding:6px 18px 6px 8px;background:linear-gradient(90deg,transparent,#1b4fb8dd 15%,#1b4fb8dd 85%,transparent);border-top:2px solid var(--cy);border-bottom:2px solid var(--cy)}
.rib i{font-size:24px;font-style:italic;letter-spacing:1px;text-shadow:0 0 10px #000,0 2px 0 #000}
.pt{font-size:28px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--gold);background:#0b1f4d;box-shadow:0 0 10px var(--cy)}
</style>
<style>
/* SUNDA LEGENDS — MOBA battlefield redesign */
html,body{min-height:100%;background:#071426;color:#f4f8ff}
body{background:radial-gradient(ellipse at 50% 0%,#285b68 0,#102b35 48%,#071426 100%) fixed}
#app{width:min(100%,1100px);max-width:1100px;margin:0 auto;padding:clamp(8px,1.5vw,18px)}
h1{font-size:clamp(23px,4vw,38px);letter-spacing:1.5px}
.sub{font-size:clamp(11px,1.6vw,14px)}
.panel{background:linear-gradient(145deg,#122d42f2,#091b2ff5);border:1px solid #77b7c8;border-radius:16px;box-shadow:0 8px 25px #0008,inset 0 0 20px #3f8ca322}
.btn{border-radius:14px;letter-spacing:.4px}
.arena{
 height:clamp(330px,60vh,610px);min-height:330px;margin:0 0 12px;
 border:2px solid #b7d5a0;border-radius:18px;
 background:
 radial-gradient(ellipse at 50% 52%,#d1c58b33 0 12%,transparent 42%),
 linear-gradient(28deg,transparent 0 43%,#b8a77a 43% 48%,#758b60 48% 51%,transparent 51%),
 linear-gradient(145deg,#4e875b 0 18%,#376d50 18% 35%,#507e55 35% 62%,#315f4a 62% 100%);
 box-shadow:inset 0 0 45px #071b18aa,0 12px 30px #0009;overflow:hidden
}
.arena:before{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse at 17% 25%,#1b4d36 0 8%,transparent 9%),
 radial-gradient(ellipse at 82% 19%,#204e36 0 9%,transparent 10%),
 radial-gradient(ellipse at 18% 78%,#1b4d36 0 11%,transparent 12%),
 radial-gradient(ellipse at 84% 78%,#1b4d36 0 10%,transparent 11%),
 repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 42px),
 repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 42px);
 pointer-events:none}
.arena:after{content:"";position:absolute;left:34%;top:38%;width:32%;height:25%;border:2px dashed #e7d79b66;border-radius:50%;transform:rotate(-18deg);pointer-events:none}
.ring{width:34%;height:24%;left:50%;top:53%;margin:-12% 0 0 -17%;border:2px solid #f7d86a66;box-shadow:0 0 25px #ffe58a33 inset}
.mm{z-index:4;width:88px;height:88px;background:#081b2ddd;border:2px solid #d6c37b;box-shadow:0 3px 12px #0009}
.mm:after{content:"";position:absolute;inset:8px;border-radius:5px;background:linear-gradient(135deg,#417c55,#1d4c65);opacity:.8;z-index:-1}
.sb{z-index:5;top:10px;background:#071522dd;border:1px solid #8bb8c8;padding:6px 12px;border-radius:20px;font-weight:800}
.gd{z-index:5;top:12px;right:12px;background:#071522dd;border:1px solid #e7c65f;padding:7px 12px}
.un{z-index:3;width:clamp(100px,20%,160px)}
#en{right:12%;top:29%}.hu{left:12%;top:48%}
.un .nm{font-size:clamp(11px,1.6vw,14px);background:#071522c9;border-radius:20px;padding:3px 8px;display:inline-block}
.un .bar{height:10px;background:#111;border:1px solid #d4e4e8}
.spr{font-size:clamp(48px,7vw,76px);filter:drop-shadow(0 7px 5px #000b)}
.xb{z-index:5;height:6px}
#fl{z-index:6}
.ctl{position:relative;z-index:7;display:flex;align-items:end;justify-content:space-between;margin:-2px 8px 4px;pointer-events:none}
.joy{pointer-events:auto;width:clamp(76px,12vw,112px);height:clamp(76px,12vw,112px);background:radial-gradient(#8ab7b766,#0b2039cc);border:2px solid #d3e8e977;box-shadow:0 4px 18px #0009}
.joy:before{content:"";position:absolute;width:75%;height:75%;border:1px dashed #b8d8dd66;border-radius:50%}
.joy i{width:42%;height:42%;background:radial-gradient(#e8f8ff,#477e9e);border:2px solid #d7efff}
.sks{pointer-events:auto;gap:clamp(5px,1.5vw,14px)}
.sk{font-size:11px;text-shadow:0 1px 3px #000}
.sk button{width:clamp(48px,8vw,68px);height:clamp(48px,8vw,68px);font-size:clamp(21px,4vw,30px);background:radial-gradient(#63a8d9,#163d65 65%,#091a30);border:3px solid #e7d17d;box-shadow:0 5px 14px #0009}
.sk:first-child button{width:clamp(42px,7vw,58px);height:clamp(42px,7vw,58px)}
#qp{position:relative;z-index:8}
@media (orientation:landscape) and (max-height:600px){
 #app{max-width:100%;padding:6px 10px}
 .arena{height:calc(100vh - 175px);min-height:245px}
 .ctl{position:absolute;left:12px;right:12px;bottom:8px;margin:0}
 .joy{width:76px;height:76px}
 .sk button{width:48px;height:48px}
 .sk:first-child button{width:42px;height:42px}
 #qp{max-height:42vh;overflow:auto}
}
@media(max-width:600px) and (orientation:portrait){
 #app{padding:8px}
 .arena{height:43vh;min-height:270px}
 .mm{width:66px;height:66px}
 #en{right:5%;top:30%}.hu{left:5%;top:50%}
 .un{width:120px}
 .sb{font-size:11px;top:8px}
 .gd{font-size:11px;top:8px;right:8px}
 .ctl{margin:0 2px}
}
.hero{border-color:#41677a;background:linear-gradient(145deg,#17364c,#0a1b2e)}
.hero.sel{border-color:#f5d36b;box-shadow:0 0 18px #f5d36b77}
.opt{border-color:#547d9a;background:linear-gradient(145deg,#1d5273,#102b4a);border-radius:12px}
.opt.ok{background:#12653d}.opt.no{background:#782d36}
.slot span{color:#f3d77c}
.drop{background:#071d31;border-color:#6bb6d0}
.chip{background:linear-gradient(#ffe8a1,#d7a63d);border:1px solid #fff0b3}
table td{padding:8px}
.note{color:#b6d5e1}
.joy{touch-action:none;user-select:none}
.mbt{width:40px;height:40px;border-radius:50%;border:2px solid #e7d17d;background:#071522dd;font-size:19px;cursor:pointer;padding:0;line-height:1}
#mb{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20}
body:has(.arena) #mb{display:none}
.mb2{position:absolute;right:10px;bottom:14px;z-index:6;width:34px;height:34px;font-size:16px}
</style>

<style>
#splash{position:fixed;inset:0;z-index:99999;background:#050d1a;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;animation:spZoom 6s ease-out forwards}
#splash::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,#000a 100%)}
#splash .tap{position:absolute;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;color:#ffe28a;font:800 15px system-ui,sans-serif;letter-spacing:2px;text-shadow:0 2px 6px #000;animation:spBlink 1.2s infinite}
#splash .ld{position:absolute;left:20%;right:20%;bottom:calc(4% + env(safe-area-inset-bottom,0px));height:6px;z-index:2;border-radius:4px;background:#0008;border:1px solid #f5c542;overflow:hidden}
#splash .ld i{display:block;height:100%;width:0;background:linear-gradient(#ffe28a,#c08a1e);animation:spLoad 2.8s linear forwards}
@keyframes spZoom{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes spBlink{50%{opacity:.35}}
@keyframes spLoad{to{width:100%}}
</style>

 if(c=="r"){if(S.hp>=100)return;S.hp=Math.min(100,S.hp+20);fl("+20","h")}
 else if(c=="i"){S.left+=10;S.tot+=10;fl("+10s","h")}
 else if(q.t=="pg"){let n=0;document.querySelectorAll(".opt").forEach((x,j)=>{if(n<2&&q.s[j]!=q.a&&!x.dataset.x){x.dataset.x=1;x.style.opacity=.25;x.style.pointerEvents="none";n++}})}
 else{const i=q.p.findIndex((p,j)=>!q.f[j]);if(i<0)return;const v=q.p[i][1];for(const j in q.f)if(q.f[j]==v)delete q.f[j];q.f[i]=v;pool()}
 S.sk[c]--;upd();$("#ctl").outerHTML=ctrl()}
function fx(id,c){const e=$("#"+id);if(!e)return;e.classList.remove(c);void e.offsetWidth;e.classList.add(c)}
function fl(t,k){const f=$("#fl");if(!f)return;const s=document.createElement("span");s.className="fl "+k;s.textContent=t;s.style.left=(k=="d"?20:k=="g"?55:38)+Math.random()*12+"%";f.appendChild(s);setTimeout(()=>s.remove(),1100)}
function upd(){[["#hhp",S.hp],["#ehp",100-S.sok*10]].forEach(a=>{const e=$(a[0]);e&&(e.style.width=Math.max(0,a[1])+"%")});
 const g=$("#gd");g&&(g.textContent=S.gold);const x=$("#xp");x&&(x.style.width=S.exp%150/1.5+"%");const k=$("#kb");k&&(k.textContent=S.ok);const r=$("#kr");r&&(r.textContent=S.i+1-S.ok)}

function next(){
 if(S.i>=QS.length||S.hp<=0)return end();
 clearInterval(T);sel=null;S.fb=false;document.body.style.background=ST[S.i/10|0].bg+" fixed";
 const q=QS[S.i],tot=q.t=="pg"?20:45;S.left=tot;S.tot=tot;
 let body;
 if(q.t=="pg"){q.s=q.s||sh(q.o);body=q.s.map((o,i)=>`<button class="opt" onclick="pick(this,${i})"><b>${"ABCDE"[i]}</b>${esc(o)}</button>`).join("")}
 else{q.c=q.c||sh(q.p.map(x=>x[1]));q.f={};
  body=q.p.map((p,i)=>`<div class="slot"><span>${esc(p[0])}</span><div class="drop" data-i="${i}" onclick="put(${i})" ondragover="event.preventDefault()" ondrop="dr(event,${i})"></div></div>`).join("")+`<div class="pool" id="pool"></div><button class="btn" onclick="check()">⚔️ Serang!</button>`}
 app.innerHTML=hud()+`<div class="panel" id="qp"><div class="tag">${S.i%10==9?"👹 BOSS • ":""}${NM[q.t]} • ⏱ <span id="tl">${tot}</span>s</div><div class="bar tm"><i id="tb" style="width:100%"></i></div><div class="q">${esc(q.q)}</div>${body}</div><div class="panel" id="lv" style="display:none"></div>`;
 app.insertAdjacentHTML("beforeend",ctrl());
 lvu();if(q.t!="pg")pool();
 T=setInterval(()=>{S.left--;$("#tl")&&($("#tl").textContent=S.left,$("#tb").style.width=S.left/S.tot*100+"%");if(S.left<=0){clearInterval(T);res(false,true)}},1000)}

function pool(){const q=QS[S.i],used=Object.values(q.f);
 $("#pool").innerHTML=q.c.filter(c=>!used.includes(c)).map(c=>`<div class="chip ${sel==c?"sel":""}" draggable="true" ondragstart="event.dataTransfer.setData('t','${c.replace(/'/g,"\\'")}')" onclick="sel=sel==this.textContent?null:this.textContent;pool()">${esc(c)}</div>`).join("");
 document.querySelectorAll(".drop").forEach(d=>{const v=q.f[d.dataset.i];d.textContent=v||"…";d.classList.toggle("f",!!v)})}
function put(i){const q=QS[S.i];if(S.fb)return;if(q.f[i]&&!sel){delete q.f[i]}else if(sel){q.f[i]=sel;sel=null}pool()}
function dr(e,i){e.preventDefault();sel=e.dataTransfer.getData("t");put(i)}
function check(){const q=QS[S.i];if(Object.keys(q.f).length<q.p.length){ban("Eusian kabéh heula!","#fff");return}
 let all=true;document.querySelectorAll(".drop").forEach(d=>{const r=q.f[d.dataset.i]==q.p[d.dataset.i][1];all&&=r;d.classList.add(r?"ok":"no");if(!r)d.textContent=q.f[d.dataset.i]+" ➜ "+q.p[d.dataset.i][1]});
 res(all)}
function pick(b,i){if(S.fb)return;const q=QS[S.i],r=q.s[i]==q.a;
 document.querySelectorAll(".opt").forEach((x,j)=>{if(q.s[j]==q.a)x.classList.add("ok")});if(!r)b.classList.add("no");res(r)}

const KILL=["FIRST BLOOD!","DOUBLE KILL!","TRIPLE KILL!","MANIAC!","SAVAGE!"];
function res(r,to){if(S.fb)return;S.fb=true;clearInterval(T);
 if(r){const bonus=Math.max(0,S.left),m=S.i%10==9?2:1;S.gold+=(100+bonus*3)*m;S.sok++;fl('+'+((100+bonus*3)*m),'g');fx('hr','atk');fx('en','hurt');const was=lv();S.exp+=60+bonus;S.ok++;S.st++;S.mx=Math.max(S.mx,S.st);
  ban(S.st<=5?(S.ok==1?KILL[0]:KILL[Math.min(S.st-1,4)]):"LEGENDARY!","#ffd54a");Mus.sfx("ok");if(lv()>was)setTimeout(()=>{ban("LEVEL UP! Lv "+lv(),"#7fd8ff");Mus.sfx("lvl")},900)}
 else{if(to){const q=QS[S.i];if(q.t=="pg")document.querySelectorAll(".opt").forEach((x,j)=>{if(q.s[j]==q.a)x.classList.add("ok")});else document.querySelectorAll(".drop").forEach(d=>{d.classList.add("no");d.textContent=q.p[d.dataset.i][1]})}S.hp=Math.max(0,S.hp-15);fl('-15','d');fx('en','atk2');fx('hr','hurt');S.st=0;ban(to?"WAKTU TEUREUH!":"KAKEUNAAN DAMAGE -15","#ff6a6a");Mus.sfx("no");$("#app").classList.add("hit");setTimeout(()=>$("#app").classList.remove("hit"),450)}
 upd();sync();S.i++;setTimeout(S.hp<=0||S.i>=40?end:S.i%10==0?stageClear:next,r?1500:1900)}

function end(){clearInterval(T);const w=S.hp>0;S.done=1;w?(Mus.play("menu"),Mus.sfx("win")):(Mus.stop(),Mus.sfx("lose"));S.board=1;sync();
 app.innerHTML=`<h1 style="font-size:40px;color:${w?"#ffd54a":"#ff6a6a"}">${w?"VICTORY!":"DEFEAT"}</h1><div class="big">${w?H[S.hero][1]:"💀"}</div>
 <div class="panel"><div class="stats"><span>${esc(S.name)} • Lv ${lv()}</span><span>💰 ${S.gold}</span></div>
 <p>Bener: <b>${S.ok}</b> • Salah: <b>${S.i-S.ok}</b> • Streak pangpanjangna: <b>${S.mx}</b> • Sésa HP: <b>${S.hp}</b></p>
 <p class="note">${w?"Mantap! Anjeun geus nalukkeun arena Basa Sunda.":"HP béak. Cobaan deui, diajar deui matéri na!"}</p></div>
 <div class="panel"><div class="tag">PAPAN PERINGKAT ${S.room?"• RUANGAN "+esc(S.room)+(room?"":" (offline)"):"(Solo)"}</div><table id="lb"></table></div>
 <button class="btn" onclick="S.board=0;S.done=0;QS.forEach(q=>{delete q.s;delete q.c});start()">🔁 Maén Deui</button><button class="btn b" onclick="S.board=0;S.done=0;lobby()">🏠 Lobi</button>`;board()}
function stageIntro(){const s=ST[S.i/10|0];S.sok=0;S.sk={r:2,i:2,b:2};S.board=0;document.body.style.background=s.bg+" fixed";
 app.innerHTML=hud()+`<div class="panel" style="text-align:center"><div class="big">${s.e}</div><h1>${s.n}</h1><div class="sub">${s.d}</div><p>👹 Boss: <b>${s.boss}</b><br><small>Soal ka-10 = Boss (Gold ×2)</small></p></div><button class="btn" onclick="next()">⚔️ Asup Arena</button>`;Mus.play("b"+Math.min(S.i/10|0,3))}
function stageClear(){const k=S.i/10-1,st=S.sok>=9?3:S.sok>=6?2:1,b=st*100;S.gold+=b;S.exp+=st*40;S.hp=Math.min(100,S.hp+20);S.board=1;sync();
 app.innerHTML=`<h1>STAGE ${k+1} CLEAR!</h1><div class="big">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><div class="panel"><p>Bener: <b>${S.sok}/10</b> • Bonus 💰 ${b} • ❤️ +20 HP</p><p>Total 💰 ${S.gold} • HP ${S.hp} • Lv ${lv()}</p></div><div class="panel"><div class="tag">PAPAN PERINGKAT ${S.room?"• "+esc(S.room):"(Solo)"}</div><table id="lb"></table></div><button class="btn" onclick="stageIntro()">${ST[k+1].e} Stage ${k+2} ➜</button>`;ban("STAGE CLEAR","#ffd54a");Mus.play("menu");Mus.sfx("win");board()}
(()=>{let d=null;const mv=e=>{const r=d.r,cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=r.width/2,l=Math.hypot(dx,dy)||1,k=Math.min(l,m*.6);dx=dx/l*k;dy=dy/l*k;
d.j.querySelector("i").style.transform=`translate(${dx}px,${dy}px)`;S.px=Math.max(-10,Math.min(170,(S.px||0)+dx/m*3));S.py=Math.max(-60,Math.min(80,(S.py||0)+dy/m*3));const h=$("#hr");h&&(h.style.translate=`${S.px}px ${S.py}px`)};
document.addEventListener("pointerdown",e=>{const j=e.target.closest&&e.target.closest(".joy");if(!j)return;d={j,r:j.getBoundingClientRect()};mv(e)});
document.addEventListener("pointermove",e=>{if(d)mv(e)});
const up=()=>{if(!d)return;const k=d.j.querySelector("i");k&&(k.style.transform="");d=null};
document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up)})();
Mus.upd();lobby();
</script></body></html>
